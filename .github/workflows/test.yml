name: Run tests
on:
  push:
    branches: [main, perf/step5-typed-slots]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  actions: write
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: ['lts', '1', 'pre']
        julia-arch: [x64]
        os: [ubuntu-latest, windows-latest, macOS-latest]
        exclude:
          - os: macOS-latest
            julia-arch: x86
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/cache@v2
      # All three dep repos are public — no PAT rewrite needed. SHAs must
      # match the validated pins recorded in test/Project.toml's header.
      - name: Install unregistered test dependencies
        run: |
          git clone -b pre-inference https://github.com/nsiccha/DynamicObjects.jl.git ../DynamicObjects.jl
          git -C ../DynamicObjects.jl checkout 463b82aebc0aff443e9894ea6cec6413c3707ce5
          git clone -b dev https://github.com/nsiccha/HTMX.jl.git ../HTMX.jl
          git -C ../HTMX.jl checkout d52ce5be0f42e3c375370c85499ba5c395f781a8
          git clone -b devibe https://github.com/nsiccha/HTMXObjects.jl.git ../HTMXObjects.jl
          git -C ../HTMXObjects.jl checkout 008509ef908d255d9b73eebfceb4bd70bbe6f10c
          julia --project=test -e 'using Pkg; Pkg.develop([PackageSpec(path=pwd()), PackageSpec(path="../DynamicObjects.jl"), PackageSpec(path="../HTMX.jl"), PackageSpec(path="../HTMXObjects.jl")]); Pkg.instantiate(); Pkg.precompile()'
      # Direct include, NOT Pkg.test: Pkg.test's 1.10 sandbox cannot resolve
      # this dep shape (unregistered direct + transitive deps). -tauto: the
      # concurrency stress item only exercises true parallelism with >= 2
      # threads (its handshake makes the assertions hold even at -t1).
      - name: Run tests
        shell: bash
        run: |
          set +e
          julia -tauto --project=test -e 'include("test/runtests.jl")' 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Failed test log tail'
              echo '```text'
              tail -n 500 test-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            details=$(awk '
              /Test Failed|Error During Test|Some tests did not pass/ { remaining = 100 }
              remaining > 0 { print; remaining-- }
            ' test-output.log | tail -n 300)
            [ -n "$details" ] || details=$(tail -n 160 test-output.log)
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::error title=Suite failure details::$details"
          fi
          exit "$status"
      - name: Verify selection surface
        shell: bash
        run: |
          julia -tauto --project=test test/select.jl -- --list > test-list.log
          grep -q 'test/items.jl::Concurrency stress test' test-list.log
          [ "$(wc -l < test-list.log)" -gt 60 ]
          julia -tauto --project=test test/select.jl -- --tag=format
